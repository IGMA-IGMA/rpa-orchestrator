services:
  postgres:
    image: postgres:15-alpine
    container_name: rpa_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: rpa_redis
    restart: always

  web:
    build: .
    container_name: rpa_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"   # только веб-сервер наружу
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  celery-worker:
    build: .
    container_name: rpa_celery_worker
    command: celery -A rpa_orchestrator worker --loglevel=info
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  celery-beat:
    build: .
    container_name: rpa_celery_beat
    command: celery -A rpa_orchestrator beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume: