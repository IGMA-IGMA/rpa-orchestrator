<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPA Оркестратор</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { padding-top: 2rem; }
        .task-status { font-weight: bold; }
        .status-pending { color: #ffc107; }
        .status-processing { color: #0dcaf0; }
        .status-success { color: #198754; }
        .status-failure { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">📋 RPA Оркестратор</h1>
        <nav class="nav nav-pills mb-4">
            <a class="nav-link" href="{% url 'tasks:task_list' %}">Список задач</a>
            <a class="nav-link" href="{% url 'tasks:task_create' %}">Создать задачу</a>
            <a class="nav-link" href="{% url 'tasks:dashboard' %}">Дашборд</a>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
